<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Statement (Section 3.4)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f2f2f2;
      font-family: "Times New Roman", Times, serif;
    }
    .frame-wrap {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 8px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="frame-wrap">
    <iframe id="reportFrame" src="../index.html" title="First-Half Report"></iframe>
  </div>

  <script>
    (function () {
      const frame = document.getElementById("reportFrame");
      const targetId = "sec-3-4";

      function jumpToTarget() {
        try {
          const doc = frame.contentDocument || frame.contentWindow.document;
          if (!doc) return false;
          const target = doc.getElementById(targetId);
          if (!target) return false;
          target.scrollIntoView({ behavior: "smooth", block: "start" });
          return true;
        } catch (e) {
          return false;
        }
      }

      frame.addEventListener("load", () => {
        let tries = 0;
        const timer = setInterval(() => {
          tries += 1;
          if (jumpToTarget() || tries > 40) {
            clearInterval(timer);
          }
        }, 150);
      });
    })();
  </script>
</body>
</html>
